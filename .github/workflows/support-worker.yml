name: Support worker

on:
  push:
    branches: [main, master]
    paths:
      - 'support-worker/**'
      - '.github/workflows/support-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: support-worker
          command: deploy
          secrets: |
            SUPPORT_INBOX
            RESEND_API_KEY
        env:
          SUPPORT_INBOX: ${{ secrets.SUPPORT_INBOX }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
