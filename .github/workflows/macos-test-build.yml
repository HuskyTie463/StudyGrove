name: macOS USB package

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: |
          flutter --version
          flutter config --enable-macos-desktop
          flutter config --no-enable-macos-arm64-only || true
          flutter precache --macos

      - run: flutter pub get

      - name: Build macOS with built-in AI keys
        env:
          BUNDLED_STUDY_AI_KEY: ${{ secrets.BUNDLED_STUDY_AI_KEY }}
          BUNDLED_OPENAI_TTS_KEY: ${{ secrets.BUNDLED_OPENAI_TTS_KEY }}
        run: |
          if [ -z "$BUNDLED_STUDY_AI_KEY" ] || [ -z "$BUNDLED_OPENAI_TTS_KEY" ]; then
            echo "Missing BUNDLED_STUDY_AI_KEY or BUNDLED_OPENAI_TTS_KEY repo secrets."
            exit 1
          fi
          flutter build macos --release \
            --dart-define=BUNDLED_STUDY_AI_KEY="$BUNDLED_STUDY_AI_KEY" \
            --dart-define=BUNDLED_OPENAI_TTS_KEY="$BUNDLED_OPENAI_TTS_KEY"

      - name: Zip app for USB
        run: |
          APP=$(find build/macos -name 'StudyGrove.app' | head -n 1)
          if [ -z "$APP" ]; then
            echo "Built app not found"
            find build/macos -name '*.app'
            exit 1
          fi
          mkdir -p dist/StudyGrove
          ditto "$APP" dist/StudyGrove/StudyGrove.app
          cp "macos/How to open.txt" dist/StudyGrove/
          cp "macos/Open Study Grove.command" dist/StudyGrove/
          cp "macos/Usb.entitlements" dist/StudyGrove/Usb.entitlements
          chmod +x "dist/StudyGrove/Open Study Grove.command"
          # Windows checkouts can leave CRLF, which breaks double-click .command on Mac.
          perl -pi -e 's/\r\n|\r/\n/g' \
            "dist/StudyGrove/Open Study Grove.command" \
            "dist/StudyGrove/How to open.txt"
          if grep -q '\$(' macos/Usb.entitlements macos/Runner/Release.entitlements; then
            echo "ERROR: USB entitlements still contain Xcode \$(...) variables."
            echo "codesign would embed them literally and the Mac app can quit on launch."
            exit 1
          fi
          xattr -cr dist/StudyGrove || true
          # Re-sign ad-hoc WITH USB entitlements. Signing without JIT /
          # library-validation exceptions lets Gatekeeper SIGKILL the copy.
          # Do not use Release.entitlements here: it used to contain
          # $(AppIdentifierPrefix), which codesign cannot expand.
          codesign --force --deep --sign - \
            --entitlements macos/Usb.entitlements \
            dist/StudyGrove/StudyGrove.app
          codesign --force --sign - "dist/StudyGrove/Open Study Grove.command" || true
          echo "==== binary arch ===="
          file dist/StudyGrove/StudyGrove.app/Contents/MacOS/StudyGrove || true
          INFO=$(lipo -info dist/StudyGrove/StudyGrove.app/Contents/MacOS/StudyGrove)
          echo "$INFO"
          if ! echo "$INFO" | grep -q arm64 || ! echo "$INFO" | grep -q x86_64; then
            echo "ERROR: Mac binary is not universal (need arm64 + x86_64). Got: $INFO"
            exit 1
          fi
          echo "==== entitlements ===="
          codesign -d --entitlements - dist/StudyGrove/StudyGrove.app | tee /tmp/usb-ents.txt || true
          if grep -q '\$(' /tmp/usb-ents.txt; then
            echo "ERROR: signed USB app still has unexpanded \$(...) entitlements."
            exit 1
          fi
          echo "==== nested binaries ===="
          find dist/StudyGrove/StudyGrove.app/Contents -type f \( -name '*.dylib' -o -name '*.so' \) \
            | while read -r f; do
                lipo -info "$f" 2>/dev/null || file "$f"
              done | head -n 80
          ditto -c -k --keepParent dist/StudyGrove StudyGrove-macos.zip
          ls -lh StudyGrove-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StudyGrove-macos
          path: StudyGrove-macos.zip

      - name: Put zip on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete macos-usb --yes || true
          gh release create macos-usb \
            --title "Study Grove for Mac (USB)" \
            --notes "Download a FRESH StudyGrove-macos.zip (old copies keep crashing). Copy the StudyGrove folder to the Mac Desktop, then double-click Open Study Grove.command. Do not open the .app from the USB stick. If macOS blocks the command, right-click it → Open. Fallback: xattr -cr ~/Desktop/StudyGrove && open ~/Desktop/StudyGrove/StudyGrove.app" \
            StudyGrove-macos.zip
