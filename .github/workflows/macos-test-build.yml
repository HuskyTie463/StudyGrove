name: macOS USB package

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: |
          flutter --version
          flutter config --enable-macos-desktop
          flutter precache --macos

      - run: flutter pub get

      - run: flutter build macos --release

      - name: Zip app for USB
        run: |
          APP=$(find build/macos -name 'StudyGrove.app' | head -n 1)
          if [ -z "$APP" ]; then
            echo "Built app not found"
            find build/macos -name '*.app'
            exit 1
          fi
          mkdir -p dist/StudyGrove
          ditto "$APP" dist/StudyGrove/StudyGrove.app
          cp "macos/How to open.txt" dist/StudyGrove/
          cp "macos/Open Study Grove.command" dist/StudyGrove/
          chmod +x "dist/StudyGrove/Open Study Grove.command"
          xattr -cr dist/StudyGrove/StudyGrove.app || true
          codesign --force --deep --sign - dist/StudyGrove/StudyGrove.app
          file dist/StudyGrove/StudyGrove.app/Contents/MacOS/StudyGrove || true
          lipo -info dist/StudyGrove/StudyGrove.app/Contents/MacOS/StudyGrove || true
          ditto -c -k --keepParent dist/StudyGrove StudyGrove-macos.zip
          ls -lh StudyGrove-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StudyGrove-macos
          path: StudyGrove-macos.zip

      - name: Put zip on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete macos-usb --yes || true
          gh release create macos-usb \
            --title "Study Grove for Mac (USB)" \
            --notes "Download StudyGrove-macos.zip. Copy the StudyGrove folder to the Mac Desktop, then double-click Open Study Grove.command. If it quits unexpectedly, run: xattr -cr ~/Desktop/StudyGrove/StudyGrove.app && open ~/Desktop/StudyGrove/StudyGrove.app" \
            StudyGrove-macos.zip
