name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-*'

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Check required secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            BUILD_PROVISION_PROFILE_BASE64 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY
          do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets listed above (see TESTFLIGHT.md), then re-run this workflow."
            exit 1
          fi
          echo "All required secret names are present."

      - name: Install Apple Distribution cert and App Store profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PP_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          decode_b64() {
            local src="$1"
            local dest="$2"
            printf '%s' "$src" \
              | tr -d '\r\n' \
              | sed 's/-----BEGIN CERTIFICATE-----//g;s/-----END CERTIFICATE-----//g' \
              | openssl base64 -d -A > "$dest"
          }

          decode_b64 "$BUILD_CERTIFICATE_BASE64" "$CERTIFICATE_PATH"
          decode_b64 "$BUILD_PROVISION_PROFILE_BASE64" "$PP_PATH"

          if [ ! -s "$CERTIFICATE_PATH" ] || [ ! -s "$PP_PATH" ]; then
            echo "Decoded certificate or provisioning profile is empty."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"

          echo "Team ID: $TEAM_ID"
          echo "Profile name: $PROFILE_NAME"
          echo "Application identifier: $APP_ID"

          case "$APP_ID" in
            *com.adaracurry.studygrove) ;;
            *)
              echo "Provisioning profile is not for com.adaracurry.studygrove."
              exit 1
              ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          sed -i '' 's/iPhone Developer/Apple Distribution/g' ios/Runner.xcodeproj/project.pbxproj
          {
            echo "CODE_SIGN_STYLE=Manual"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
            echo "DEVELOPMENT_TEAM=$TEAM_ID"
            echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"
          } >> ios/Flutter/Release.xcconfig

          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.adaracurry.studygrove string $PROFILE_NAME" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :compileBitcode bool false' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$EXPORT_PLIST"
          echo "EXPORT_PLIST=$EXPORT_PLIST" >> "$GITHUB_ENV"
          echo "ASC_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "Signing material installed."
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Flutter pub get
        run: |
          flutter --version
          flutter precache --ios
          flutter pub get

      - name: Build App Store IPA
        env:
          BUNDLED_STUDY_AI_KEY: ${{ secrets.BUNDLED_STUDY_AI_KEY }}
          BUNDLED_OPENAI_TTS_KEY: ${{ secrets.BUNDLED_OPENAI_TTS_KEY }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          DART_DEFINES=()
          if [ -n "${BUNDLED_STUDY_AI_KEY:-}" ]; then
            DART_DEFINES+=(--dart-define="BUNDLED_STUDY_AI_KEY=$BUNDLED_STUDY_AI_KEY")
          fi
          if [ -n "${BUNDLED_OPENAI_TTS_KEY:-}" ]; then
            DART_DEFINES+=(--dart-define="BUNDLED_OPENAI_TTS_KEY=$BUNDLED_OPENAI_TTS_KEY")
          fi
          flutter build ipa --release \
            --export-options-plist="$EXPORT_PLIST" \
            --build-number="$BUILD_NUMBER" \
            "${DART_DEFINES[@]}"
          IPA="$(find build/ios/ipa -name '*.ipa' -type f | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "IPA not found after flutter build ipa."
            find build/ios -name '*.ipa' || true
            exit 1
          fi
          ls -lh "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc_keys"
          mkdir -p "$KEY_DIR"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | tr -d '\r' > "$KEY_DIR/AuthKey.p8"
          printf '\n' >> "$KEY_DIR/AuthKey.p8"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key_dir = Path(os.environ["RUNNER_TEMP"]) / "asc_keys"
          payload = {
              "key_id": os.environ["APP_STORE_CONNECT_KEY_ID"],
              "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
              "key_filepath": str(key_dir / "AuthKey.p8"),
          }
          (key_dir / "api_key.json").write_text(json.dumps(payload))
          PY
          fastlane pilot upload \
            --ipa "$IPA_PATH" \
            --api_key_path "$KEY_DIR/api_key.json" \
            --skip_waiting_for_build_processing true
          echo "Upload finished. In App Store Connect, open TestFlight and wait for processing."
