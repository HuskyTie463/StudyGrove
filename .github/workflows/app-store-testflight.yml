name: App Store TestFlight

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store build to upload (do macos first)
        required: true
        default: macos
        type: choice
        options:
          - macos
          - ios
  push:
    tags:
      - 'macos-tf-*'
      - 'ios-*'

permissions:
  contents: read

jobs:
  macos:
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'macos')
      || (github.event_name == 'push' && startsWith(github.ref_name, 'macos-tf-'))
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Check Mac TestFlight secrets
        env:
          MAC_BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
          MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            MAC_BUILD_CERTIFICATE_BASE64 \
            MAC_INSTALLER_CERTIFICATE_BASE64 \
            MAC_PROVISION_PROFILE_BASE64 \
            P12_PASSWORD \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY
          do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the Mac secrets in TESTFLIGHT.md, then re-run with platform=macos."
            exit 1
          fi
          echo "Mac TestFlight secret names are present."

      - name: Install Mac App Store certs and profile
        env:
          MAC_BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
          MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          APP_P12="$RUNNER_TEMP/mac-app.p12"
          INSTALLER_P12="$RUNNER_TEMP/mac-installer.p12"
          PP_PATH="$RUNNER_TEMP/mac-appstore.provisionprofile"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          decode_b64() {
            printf '%s' "$1" \
              | tr -d '\r\n' \
              | sed 's/-----BEGIN CERTIFICATE-----//g;s/-----END CERTIFICATE-----//g' \
              | openssl base64 -d -A > "$2"
          }

          decode_b64 "$MAC_BUILD_CERTIFICATE_BASE64" "$APP_P12"
          decode_b64 "$MAC_INSTALLER_CERTIFICATE_BASE64" "$INSTALLER_P12"
          decode_b64 "$MAC_PROVISION_PROFILE_BASE64" "$PP_PATH"

          if [ ! -s "$APP_P12" ] || [ ! -s "$INSTALLER_P12" ] || [ ! -s "$PP_PATH" ]; then
            echo "Decoded Mac certificate or provisioning profile is empty."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/mac-profile.plist"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/mac-profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/mac-profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/mac-profile.plist")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/mac-profile.plist" 2>/dev/null || true)"
          if [ -z "$APP_ID" ]; then
            APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/mac-profile.plist")"
          fi

          echo "Team ID: $TEAM_ID"
          echo "Mac profile name: $PROFILE_NAME"
          echo "Application identifier: $APP_ID"

          case "$APP_ID" in
            *com.adaracurry.studygrove) ;;
            *)
              echo "Mac provisioning profile is not for com.adaracurry.studygrove."
              exit 1
              ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.provisionprofile"

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)".*/\1/p' | grep -E '3rd Party Mac Developer Application|Apple Distribution' | head -n 1 || true)"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)".*/\1/p' | grep -E '3rd Party Mac Developer Installer' | head -n 1 || true)"
          if [ -z "$APP_IDENTITY" ] || [ -z "$INSTALLER_IDENTITY" ]; then
            echo "Could not find Mac App Distribution and Mac Installer identities in the keychain."
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "App identity: $APP_IDENTITY"
          echo "Installer identity: $INSTALLER_IDENTITY"

          ENT="$RUNNER_TEMP/AppStore.entitlements"
          HELPER_ENT="$RUNNER_TEMP/AppStore-helper.entitlements"
          export TEAM_ID
          export APP_ID
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          team_id = os.environ["TEAM_ID"]
          app_id = os.environ.get("APP_ID") or f"{team_id}.com.adaracurry.studygrove"
          profile = plistlib.loads((Path(os.environ["RUNNER_TEMP"]) / "mac-profile.plist").read_bytes())
          profile_ents = dict(profile.get("Entitlements") or {})

          src = Path("macos/Runner/AppStore.entitlements").read_text()
          src = src.replace("$(AppIdentifierPrefix)", f"{team_id}.")
          src = src.replace("$(DEVELOPMENT_TEAM)", team_id)
          merged = plistlib.loads(src.encode())

          for key, value in profile_ents.items():
              if key in ("get-task-allow", "com.apple.security.get-task-allow"):
                  continue
              if key == "application-identifier":
                  merged["com.apple.application-identifier"] = value
              else:
                  merged[key] = value

          merged["com.apple.application-identifier"] = (
              merged.get("com.apple.application-identifier") or app_id
          )
          merged["com.apple.developer.team-identifier"] = team_id
          merged["com.apple.security.app-sandbox"] = True

          out = Path(os.environ["RUNNER_TEMP"]) / "AppStore.entitlements"
          with out.open("wb") as fh:
              plistlib.dump(merged, fh, fmt=plistlib.FMT_XML)

          helper = dict(merged)
          helper.pop("com.apple.application-identifier", None)
          helper.pop("com.apple.developer.team-identifier", None)
          helper.pop("keychain-access-groups", None)
          helper["com.apple.security.app-sandbox"] = True
          helper["com.apple.security.inherit"] = True
          helper_path = Path(os.environ["RUNNER_TEMP"]) / "AppStore-helper.entitlements"
          with helper_path.open("wb") as fh:
              plistlib.dump(helper, fh, fmt=plistlib.FMT_XML)

          print("Merged MAS entitlements:")
          for key in sorted(merged):
              print(f"  {key} = {merged[key]!r}")
          PY

          SIGNED_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.application-identifier' "$ENT")"
          SIGNED_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$ENT")"
          echo "codesign application-identifier=$SIGNED_APP_ID"
          echo "codesign team-identifier=$SIGNED_TEAM"
          case "$SIGNED_APP_ID" in
            "${TEAM_ID}.com.adaracurry.studygrove") ;;
            *)
              echo "Merged entitlements are missing ${TEAM_ID}.com.adaracurry.studygrove"
              exit 1
              ;;
          esac

          umask 077
          printf '%s' "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/keychain.pw"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "MAC_PP_PATH=$PP_PATH" >> "$GITHUB_ENV"
          echo "MAC_APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "MAC_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "MAC_ENTITLEMENTS=$ENT" >> "$GITHUB_ENV"
          echo "MAC_HELPER_ENTITLEMENTS=$HELPER_ENT" >> "$GITHUB_ENV"
          echo "ASC_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Enable macOS desktop
        run: |
          flutter --version
          flutter config --enable-macos-desktop
          flutter config --no-enable-macos-arm64-only || true
          flutter precache --macos
          flutter pub get

      - name: Build macOS release
        env:
          STUDY_AI_PROXY_URL: ${{ secrets.STUDY_AI_PROXY_URL }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          # Apple already processed 1.0.6 (2), (3), and (4). Never reuse those.
          if [ "$BUILD_NUMBER" -lt 5 ]; then
            BUILD_NUMBER=5
          fi
          echo "CFBundleVersion=$BUILD_NUMBER"
          if [ -n "${STUDY_AI_PROXY_URL:-}" ]; then
            flutter build macos --release \
              --build-number="$BUILD_NUMBER" \
              --dart-define="STUDY_AI_PROXY_URL=$STUDY_AI_PROXY_URL"
          else
            flutter build macos --release \
              --build-number="$BUILD_NUMBER"
          fi

      - name: Sign for Mac App Store and make pkg
        run: |
          set -euo pipefail
          APP="$(find build/macos -name 'StudyGrove.app' -type d | head -n 1)"
          if [ -z "$APP" ]; then
            echo "StudyGrove.app not found"
            find build/macos -name '*.app' || true
            exit 1
          fi
          echo "App: $APP"
          INFO="$(lipo -info "$APP/Contents/MacOS/StudyGrove" || true)"
          echo "$INFO"
          if ! echo "$INFO" | grep -q arm64 || ! echo "$INFO" | grep -q x86_64; then
            echo "ERROR: Mac binary is not universal (need arm64 + x86_64). Got: $INFO"
            exit 1
          fi

          cp "$MAC_PP_PATH" "$APP/Contents/embedded.provisionprofile"
          /usr/libexec/PlistBuddy -c 'Set :LSApplicationCategoryType public.app-category.education' "$APP/Contents/Info.plist" \
            || /usr/libexec/PlistBuddy -c 'Add :LSApplicationCategoryType string public.app-category.education' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :ITSAppUsesNonExemptEncryption false' "$APP/Contents/Info.plist" \
            || /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' "$APP/Contents/Info.plist"
          echo "LSApplicationCategoryType=$(/usr/libexec/PlistBuddy -c 'Print :LSApplicationCategoryType' "$APP/Contents/Info.plist")"
          echo "CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          echo "ITSAppUsesNonExemptEncryption=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Contents/Info.plist")"
          security unlock-keychain -p "$(cat "$RUNNER_TEMP/keychain.pw")" "$KEYCHAIN_PATH"

          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -type f \( -name '*.dylib' -o -name '*.so' \) | while read -r f; do
              codesign --force --options runtime --timestamp --sign "$MAC_APP_IDENTITY" "$f"
            done
            find "$APP/Contents/Frameworks" -type d -name '*.framework' | awk '{ print length, $0 }' | sort -nr | cut -d' ' -f2- | while read -r f; do
              codesign --force --options runtime --timestamp --sign "$MAC_APP_IDENTITY" "$f"
            done
          fi
          # Native assets (SoLoud, etc.) can land outside Frameworks.
          # Hardened Runtime kills unsigned Mach-O files at launch.
          MAIN_BIN="$APP/Contents/MacOS/StudyGrove"
          find "$APP/Contents" -type f ! -path "$MAIN_BIN" | while read -r f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --sign "$MAC_APP_IDENTITY" "$f"
            fi
          done
          # Nested helpers must not claim the app's application-identifier (ITMS-90885).
          find "$APP/Contents" -type d -name '*.app' | while read -r helper; do
            codesign --force --options runtime --timestamp \
              --entitlements "$MAC_HELPER_ENTITLEMENTS" \
              --sign "$MAC_APP_IDENTITY" "$helper"
          done

          codesign --force --options runtime --timestamp \
            --identifier com.adaracurry.studygrove \
            --entitlements "$MAC_ENTITLEMENTS" \
            --sign "$MAC_APP_IDENTITY" \
            "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/signed.entitlements" 2>/dev/null || true
          echo "==== signed app entitlements ===="
          cat "$RUNNER_TEMP/signed.entitlements" || true
          EXPECTED_APP_ID="${ASC_TEAM_ID}.com.adaracurry.studygrove"
          if ! grep -a -F -q "$EXPECTED_APP_ID" "$RUNNER_TEMP/signed.entitlements"; then
            echo "ITMS-90886 guard: signed app is missing application-identifier $EXPECTED_APP_ID"
            exit 1
          fi
          echo "Signed application-identifier $EXPECTED_APP_ID is present."

          PKG="$RUNNER_TEMP/StudyGrove.pkg"
          productbuild --component "$APP" /Applications --sign "$MAC_INSTALLER_IDENTITY" "$PKG"
          pkgutil --check-signature "$PKG" || true
          ls -lh "$PKG"
          echo "PKG_PATH=$PKG" >> "$GITHUB_ENV"

      - name: Upload Mac pkg to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc_keys"
          mkdir -p "$KEY_DIR" "$HOME/.appstoreconnect/private_keys"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | tr -d '\r' > "$KEY_DIR/AuthKey.p8"
          printf '\n' >> "$KEY_DIR/AuthKey.p8"
          cp "$KEY_DIR/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key_dir = Path(os.environ["RUNNER_TEMP"]) / "asc_keys"
          payload = {
              "key_id": os.environ["APP_STORE_CONNECT_KEY_ID"],
              "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
              "key": (key_dir / "AuthKey.p8").read_text(),
          }
          (key_dir / "api_key.json").write_text(json.dumps(payload))
          PY
          # Fastlane maps APP_STORE_CONNECT_API_KEY to api_key (expects a Hash).
          unset APP_STORE_CONNECT_API_KEY
          if ! env -u APP_STORE_CONNECT_API_KEY fastlane pilot upload \
            --pkg "$PKG_PATH" \
            --api_key_path "$KEY_DIR/api_key.json" \
            --skip_waiting_for_build_processing true
          then
            echo "fastlane pilot pkg upload failed; trying altool."
            xcrun altool --upload-app --type macos --file "$PKG_PATH" \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          fi
          echo "Mac upload finished. In App Store Connect, open TestFlight → macOS and wait for processing."

  ios:
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'ios')
      || (github.event_name == 'push' && startsWith(github.ref_name, 'ios-'))
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Check iOS TestFlight secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            BUILD_PROVISION_PROFILE_BASE64 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY
          do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Finish Mac TestFlight first, then add the iOS secrets in TESTFLIGHT.md."
            exit 1
          fi
          echo "iOS TestFlight secret names are present."

      - name: Install Apple Distribution cert and App Store profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PP_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          decode_b64() {
            printf '%s' "$1" \
              | tr -d '\r\n' \
              | sed 's/-----BEGIN CERTIFICATE-----//g;s/-----END CERTIFICATE-----//g' \
              | openssl base64 -d -A > "$2"
          }

          decode_b64 "$BUILD_CERTIFICATE_BASE64" "$CERTIFICATE_PATH"
          decode_b64 "$BUILD_PROVISION_PROFILE_BASE64" "$PP_PATH"

          if [ ! -s "$CERTIFICATE_PATH" ] || [ ! -s "$PP_PATH" ]; then
            echo "Decoded certificate or provisioning profile is empty."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"

          echo "Team ID: $TEAM_ID"
          echo "Profile name: $PROFILE_NAME"
          echo "Application identifier: $APP_ID"

          case "$APP_ID" in
            *com.adaracurry.studygrove) ;;
            *)
              echo "Provisioning profile is not for com.adaracurry.studygrove."
              exit 1
              ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          sed -i '' 's/iPhone Developer/Apple Distribution/g' ios/Runner.xcodeproj/project.pbxproj
          {
            echo "CODE_SIGN_STYLE=Manual"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
            echo "DEVELOPMENT_TEAM=$TEAM_ID"
            echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"
          } >> ios/Flutter/Release.xcconfig

          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.adaracurry.studygrove string $PROFILE_NAME" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :compileBitcode bool false' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$EXPORT_PLIST"
          echo "EXPORT_PLIST=$EXPORT_PLIST" >> "$GITHUB_ENV"
          echo "Signing material installed."
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Flutter pub get
        run: |
          flutter --version
          flutter precache --ios
          flutter pub get

      - name: Build App Store IPA
        env:
          STUDY_AI_PROXY_URL: ${{ secrets.STUDY_AI_PROXY_URL }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          if [ -n "${STUDY_AI_PROXY_URL:-}" ]; then
            flutter build ipa --release \
              --export-options-plist="$EXPORT_PLIST" \
              --build-number="$BUILD_NUMBER" \
              --dart-define="STUDY_AI_PROXY_URL=$STUDY_AI_PROXY_URL"
          else
            flutter build ipa --release \
              --export-options-plist="$EXPORT_PLIST" \
              --build-number="$BUILD_NUMBER"
          fi
          IPA="$(find build/ios/ipa -name '*.ipa' -type f | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "IPA not found after flutter build ipa."
            find build/ios -name '*.ipa' || true
            exit 1
          fi
          ls -lh "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc_keys"
          mkdir -p "$KEY_DIR"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | tr -d '\r' > "$KEY_DIR/AuthKey.p8"
          printf '\n' >> "$KEY_DIR/AuthKey.p8"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key_dir = Path(os.environ["RUNNER_TEMP"]) / "asc_keys"
          payload = {
              "key_id": os.environ["APP_STORE_CONNECT_KEY_ID"],
              "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
              "key_filepath": str(key_dir / "AuthKey.p8"),
          }
          (key_dir / "api_key.json").write_text(json.dumps(payload))
          PY
          fastlane pilot upload \
            --ipa "$IPA_PATH" \
            --api_key_path "$KEY_DIR/api_key.json" \
            --skip_waiting_for_build_processing true
          echo "iOS upload finished. In App Store Connect, open TestFlight → iOS and wait for processing."
